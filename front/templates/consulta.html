<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta ao banco legado</title><link rel="stylesheet" href="/static/consulta.css"></head>
<body data-numero="{{ numero or '' }}" data-legado-id="{{ legado_id or '' }}">
<header class="mast"><div class="mast-inner"><a class="home" href="/consulta">Consulta patrimonial</a><p class="eyebrow">BANCO LEGADO · SOMENTE LEITURA</p><h1>Acervo de patrimônio</h1><p class="intro">Consulte tombos, equipamentos e seu histórico de movimentações.</p></div></header>
<main><div id="list-view"><section class="filters-panel"><div class="section-title"><div><p class="eyebrow">LOCALIZAR NO ACERVO</p><h2>Tombos</h2></div><p class="quiet">Os dados são exibidos conforme registrados no banco legado.</p></div><form id="filters" class="filters">
<label>Número<input name="numero" inputmode="numeric"></label><label>Órgão<select name="orgao_id"><option value="">Todos os órgãos</option></select></label><label>Tipo<select name="tipo_id"><option value="">Todos os tipos</option></select></label><label>Situação<select name="situacao_id"><option value="">Todas as situações</option></select></label><label class="description">Descrição<input name="descricao"></label><label class="check"><input name="somente_duplicados" type="checkbox"> Somente duplicados</label><div class="buttons"><button class="primary">Localizar</button><button type="reset" class="secondary">Limpar</button></div></form><nav id="chips" class="chips" aria-label="Filtrar por situação"></nav></section><div id="list-error" class="error" role="alert" hidden></div><div id="cards" class="cards" aria-live="polite"></div><nav class="pager" aria-label="Paginação"><button data-page="first">Primeiro</button><button data-page="prev">Anterior</button><span id="page-info"></span><button data-page="next">Próximo</button><button data-page="last">Último</button><b id="total"></b></nav></div><section id="detail-view" hidden></section></main><dialog id="movement-modal" aria-label="Detalhe da movimentação"></dialog><script src="/static/consulta.js"></script></body></html>
